name: FemSphere Backend CI Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server.js'
      - 'controllers/**'
      - 'routes/**'
      - 'middleware/**'
      - 'config/**'
      - 'services/**'
      - 'scripts/**'
      - 'schema.sql'
      - 'init_db.js'
      - 'tests/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.backend'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'server.js'
      - 'controllers/**'
      - 'routes/**'
      - 'middleware/**'
      - 'config/**'
      - 'services/**'
      - 'scripts/**'
      - 'schema.sql'
      - 'init_db.js'
      - 'tests/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.backend'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Backend Lint, Database & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: femsphere_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5001
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: femsphere_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_SSL: 'false'
      JWT_SECRET: femsphere_ci_jwt_secret_test_key_2026
      CLIENT_URL: http://localhost:3000

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🔍 Type & Lint Check
        run: npm run lint

      - name: 🗄️ Initialize PostgreSQL Database Schema
        run: npm run init-db

      - name: 🌱 Seed Demo & Master Reference Data
        run: npm run seed

      - name: 🚀 Start FemSphere API Server in Background
        run: |
          START_SERVER=true node server.js &
          npx --yes wait-on http://127.0.0.1:5001/api/health -t 30000 --interval 500

      - name: 🧪 Execute Complete Automated Test Suite
        run: npm test

  docker-build:
    name: Docker Image Build & Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: femsphere-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
