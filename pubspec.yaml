name: femsphere
description: "FemSphere - Lifetime AI Health Twin Companion (Flutter Mobile & Web)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  provider: ^6.1.2
  http: ^1.2.0
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  google_fonts: ^6.2.1
  intl: ^0.19.0
  lucide_icons: ^0.257.0
  flutter_blue_plus: ^1.35.3
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
