services:
  postgres:
    image: postgres:16-alpine
    container_name: femsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: femsphere_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d femsphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: femsphere-backend
    restart: unless-stopped
    environment:
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: femsphere_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: femsphere_production_secret_key_2026
      CLIENT_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: femsphere-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
